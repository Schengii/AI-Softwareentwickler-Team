<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperion Metrics Dashboard</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #38bdf8; --focus: #f59e0b; }
        body { font-family: system-ui, sans-serif; margin: 20px; background: var(--bg); color: var(--text); line-height: 1.5; }
        .container { max-width: 1200px; margin: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: var(--card); padding: 20px; border-radius: 8px; border: 1px solid #334155; }
        #status { padding: 10px; margin-bottom: 20px; border-radius: 4px; font-weight: bold; text-align: center; }
        .connected { background: #065f46; color: #d1fae5; }
        .disconnected { background: #991b1b; color: #fee2e2; }
        .log-container { height: 300px; overflow-y: auto; background: #020617; padding: 10px; font-family: monospace; border: 1px solid #1e293b; }
        input, button { padding: 12px; margin: 8px 0; width: 100%; box-sizing: border-box; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: white; }
        button { background: var(--accent); color: #0f172a; border: none; cursor: pointer; font-weight: bold; }
        button:hover, button:focus { outline: 3px solid var(--focus); outline-offset: 2px; }
        input:focus { outline: 3px solid var(--focus); outline-offset: 2px; }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
        h1, h2 { color: var(--accent); }
    </style>
</head>
<body>
    <a href="#main-content" class="sr-only">Zum Hauptinhalt springen</a>
    <div class="container">
        <header style="grid-column: span 2;">
            <h1>Hyperion Metrics Dashboard</h1>
            <div id="status" class="disconnected" role="status" aria-live="polite">Verbindungsstatus: Getrennt</div>
        </header>
        
        <main id="main-content" class="container" style="display: contents;">
            <section class="card">
                <h2>Live-Daten</h2>
                <div id="metrics-log" class="log-container" aria-live="polite" aria-atomic="false" role="log"></div>
            </section>
            <section class="card">
                <h2>Alert-Feed</h2>
                <div id="alerts-log" class="log-container" aria-live="assertive" aria-atomic="true" role="log"></div>
            </section>
            <section class="card" style="grid-column: span 2;">
                <h2>Regel konfigurieren</h2>
                <form id="rule-form">
                    <label for="metric_name">Metrik Name</label>
                    <input type="text" id="metric_name" name="metric_name" required>
                    
                    <label for="threshold">Schwellwert</label>
                    <input type="number" id="threshold" name="threshold" step="any" required>
                    
                    <button type="submit">Regel speichern</button>
                </form>
            </section>
        </main>
    </div>

    <script>
        const mLog = document.getElementById('metrics-log');
        const aLog = document.getElementById('alerts-log');
        const status = document.getElementById('status');
        const ws = new WebSocket(`${window.location.protocol === 'https:' ? 'wss' : 'ws'}://${window.location.host}/ws/live`);

        ws.onopen = () => { status.textContent = 'Verbunden'; status.className = 'connected'; };
        ws.onclose = () => { status.textContent = 'Getrennt'; status.className = 'disconnected'; };
        
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            const entry = document.createElement('div');
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${JSON.stringify(data)}`;
            if (data.type === 'alert') aLog.prepend(entry);
            else mLog.prepend(entry);
        };
        
        document.getElementById('rule-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.disabled = true;
            try {
                const res = await fetch('/alerts/rules', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        metric_name: document.getElementById('metric_name').value,
                        threshold: parseFloat(document.getElementById('threshold').value)
                    })
                });
                if (res.ok) alert('Regel erfolgreich gespeichert');
                else alert('Fehler beim Speichern');
            } catch (err) { alert('Netzwerkfehler'); }
            finally { btn.disabled = false; }
        };
    </script>
</body>
</html>
