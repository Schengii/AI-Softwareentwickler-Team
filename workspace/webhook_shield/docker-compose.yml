version: '3.8'

services:
  webhookshield:
    build: .
    container_name: webhookshield
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/webhookshield.db
      - APP_ENV=production
    networks:
      - web-net

networks:
  web-net:
    driver: bridge
