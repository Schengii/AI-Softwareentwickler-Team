openapi: 3.0.3
info:
  title: IncidentPilot API
  version: 1.0.0
servers:
  - url: https://api.incidentpilot.local/v1
    description: Production server
paths:
  /checks:
    get:
      summary: List all uptime checks
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of checks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Check'
    post:
      summary: Create a new uptime check
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCheck'
      responses:
        '201':
          description: Check created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Check'
  /checks/{id}/status:
    get:
      summary: Get current status of a check
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Current status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckStatus'
  /alerts/configs:
    get:
      summary: List all alert configurations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of alert configurations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertConfig'
    post:
      summary: Create a new alert configuration
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAlertConfig'
      responses:
        '201':
          description: Alert configuration created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertConfig'
  /alerts/test:
    post:
      summary: Send a test notification
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestNotification'
      responses:
        '202':
          description: Test notification queued
  /metrics:
    get:
      summary: Prometheus metrics endpoint
      responses:
        '200':
          description: Prometheus metrics in text format
          content:
            text/plain:
              schema:
                type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, user]
    Check:
      type: object
      properties:
        id:
          type: integer
        url:
          type: string
          format: uri
        interval_seconds:
          type: integer
        created_at:
          type: string
          format: date-time
        owner_id:
          type: integer
    NewCheck:
      type: object
      required:
        - url
        - interval_seconds
      properties:
        url:
          type: string
          format: uri
        interval_seconds:
          type: integer
        notification_endpoint:
          type: string
          format: uri
    CheckStatus:
      type: object
      properties:
        check_id:
          type: integer
        up:
          type: boolean
        timestamp:
          type: string
          format: date-time
    AlertConfig:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [email, webhook]
        target:
          type: string
        enabled:
          type: boolean
    NewAlertConfig:
      type: object
      required:
        - type
        - target
      properties:
        type:
          type: string
          enum: [email, webhook]
        target:
          type: string
    TestNotification:
      type: object
      required:
        - alert_config_id
      properties:
        alert_config_id:
          type: integer
