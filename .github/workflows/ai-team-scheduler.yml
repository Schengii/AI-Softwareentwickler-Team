name: AI Team Autonomous Scheduler

on:
  schedule:
    # Alle 30 Minuten tagsüber prüfen (kann in GitHub Actions angepasst werden)
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Auszuführende Aktion'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - check-issues
          - check-pr-reviews
          - check-dependencies

jobs:
  scheduled-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run GitHub Issue Watcher Cycle
        if: github.event.inputs.action == 'all' || github.event.inputs.action == 'check-issues' || github.event_name == 'schedule'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python main.py --check-issues

      - name: Run PR Review Feedback Cycle
        if: github.event.inputs.action == 'all' || github.event.inputs.action == 'check-pr-reviews' || github.event_name == 'schedule'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python main.py --check-pr-reviews

      - name: Run Dependency Vulnerability Watch
        if: github.event.inputs.action == 'all' || github.event.inputs.action == 'check-dependencies' || github.event_name == 'schedule'
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          python main.py --check-dependencies
