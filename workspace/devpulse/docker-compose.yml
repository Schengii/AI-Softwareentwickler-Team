services:
  db:
    image: postgres:15-alpine
    networks:
      - devpulse-net
    environment:
      POSTGRES_USER: devpulse
      POSTGRES_PASSWORD: password
      POSTGRES_DB: devpulse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    networks:
      - devpulse-net
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql+asyncpg://devpulse:password@db:5432/devpulse

  frontend:
    build: .
    networks:
      - devpulse-net
    ports: ["80:80"]

networks:
  devpulse-net:
    driver: bridge
