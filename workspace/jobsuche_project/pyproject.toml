[project]
name = "my_ki_project"
version = "0.1.0"
description = "KI‑Agent‑Verwaltung – Parser für Agent‑Definitionen"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Dein Name", email = "you@example.com"}]

# Kern‑Abhängigkeiten (werden beim `pip install .` installiert)
dependencies = [
    "fastapi==0.110.2",
    "uvicorn[standard]==0.30.1",
    # optional für zukünftige Validierung
    "pydantic==2.7.1",
]

# Optional‑Abhängigkeiten (z. B. für Tests)
[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-cov==5.0.0",
]

# Build‑System (PEP 517)
[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

# Tool‑Konfigurationen
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--cov=src --cov-report=term-missing"
testpaths = ["tests"]
