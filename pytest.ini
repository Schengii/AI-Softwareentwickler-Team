[pytest]
# Beschränkt die Testsammlung auf die eigene Framework-Suite. Ohne dieses testpaths sammelt
# ein blankes "pytest"/"python -m pytest" (ohne Pfadangabe) im Projekt-Root versehentlich auch
# jeden Test aus generierten workspace/<projekt>/tests-Verzeichnissen mit ein - deren eigene
# Abhängigkeiten (z.B. "from app.main import app") sind hier nicht installiert und crashen die
# Collection mit ModuleNotFoundError, was bei genug betroffenen Modulen sogar den gesamten
# pytest-Lauf mit einem internen Capture-Fehler abbrechen lässt, statt nur die echte
# Framework-Suite grün zu melden. Jedes generierte Projekt in workspace/ hat ohnehin seine
# eigene pytest.ini (siehe core/verifier/, das isoliert je Projekt-venv testet).
testpaths = tests
