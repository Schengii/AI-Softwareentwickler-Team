name: Nightly Regression Evals

# Misst jede Nacht, ob das Team an den aus realen Fehlschlägen abgeleiteten Aufgaben
# (evals/tasks.py, REGRESSION_TASKS) besser oder schlechter wird. evals/gate.py vergleicht den
# Lauf mit dem Median der vorherigen Läufe; bei einer Regression schlägt der Job fehl.
# Die Historie wird zwischen Läufen per Cache weitergegeben (evals/eval_history.json ist gitignored).

concurrency:
  group: nightly-evals
  cancel-in-progress: false

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Benchmark-Historie wiederherstellen
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: evals/eval_history.json
          key: eval-history-${{ github.run_id }}
          restore-keys: eval-history-

      - name: Python einrichten
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Regressions-Suite ausführen
        run: python main.py --eval --regression

      - name: Benchmark-Historie sichern
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: evals/eval_history.json
          key: eval-history-${{ github.run_id }}

      - name: Eval-Gate (Regression = Fehlschlag)
        run: python main.py --eval-gate
