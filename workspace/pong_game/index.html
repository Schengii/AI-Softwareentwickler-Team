<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pong Game - 2 Spieler</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body class="bg-gray-900 text-white flex flex-col items-center justify-center min-h-screen m-0 select-none">
  <div class="text-center mb-4">
    <h1 class="text-3xl font-bold tracking-wider mb-1">PONG</h1>
    <p class="text-sm text-gray-400">Spieler 1: <span class="text-emerald-400 font-semibold">W / S</span> (oder A / D) | Spieler 2: <span class="text-indigo-400 font-semibold">↑ / ↓</span> (oder ← / →)</p>
  </div>

  <div class="relative shadow-2xl rounded-lg overflow-hidden border border-gray-700">
    <canvas id="pongCanvas" width="800" height="500" class="block bg-black"></canvas>
  </div>

  <div class="mt-4 flex gap-4 text-xs text-gray-400">
    <span>[Leertaste] Pause</span>
    <span>[R] Neustart</span>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
