name: CI/CD Pipeline
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with: {python-version: '3.11'}
      # requirements-dev.txt statt nur "pip install pytest": die Pipeline installierte bisher
      # ausschließlich pytest selbst, ohne fastapi/sqlalchemy/httpx etc. - jeder Lauf wäre schon
      # beim Import von app.main gescheitert, nicht erst an einer echten Testassertion.
      - run: pip install -r requirements-dev.txt && pytest
  
  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/build-push-action@v4
        with:
          push: true
          tags: devpulse/backend:latest
