apiVersion: apps/v1
kind: Deployment
metadata:
  name: incidentpilot-api
  labels:
    app: incidentpilot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: incidentpilot
  template:
    metadata:
      labels:
        app: incidentpilot
    spec:
      containers:
      - name: api
        image: incidentpilot:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: incidentpilot-secrets
              key: database-url
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: incidentpilot-secrets
              key: jwt-secret
---
apiVersion: v1
kind: Service
metadata:
  name: incidentpilot-service
spec:
  selector:
    app: incidentpilot
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
  type: ClusterIP
