apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnichat
spec:
  replicas: 3
  selector:
    matchLabels:
      app: omnichat
  template:
    metadata:
      labels:
        app: omnichat
    spec:
      containers:
      - name: app
        image: omnichat/app:latest
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: omnichat-secrets
              key: database-url
        - name: REDIS_URL
          value: "redis://redis-service:6379"
---
apiVersion: v1
kind: Service
metadata:
  name: omnichat-service
spec:
  selector:
    app: omnichat
  ports:
  - port: 80
    targetPort: 8000
