services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnimetric-engine
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - WORKERS=4
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
