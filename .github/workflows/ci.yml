name: CI

# Läuft bei jedem Push auf main und bei jedem Pull Request gegen main, außerdem manuell
# über "Run workflow" auslösbar. Bewusst OHNE API-Keys/Secrets: Die komplette Testsuite
# ist auf echte Mocks umgestellt (siehe tests/test_mock_workflow.py, test_llm_routing.py)
# und läuft nachweislich ohne jeden externen API-Aufruf durch – so kostet CI nichts und
# jeder Fork/PR kann sie ohne Secrets-Zugriff ausführen. Echte End-to-End-Läufe mit
# echten LLM-Aufrufen bleiben bewusst ein manueller, gezielter Schritt (siehe README),
# nicht Teil jedes automatischen Laufs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Bricht einen laufenden Run für denselben Branch ab, wenn ein neuerer Push eintrifft –
# spart CI-Minuten bei mehreren schnell aufeinanderfolgenden Commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: ruff installieren
        run: pip install -r requirements-dev.txt

      - name: ruff check (workspace/ ausgeschlossen, siehe ruff.toml)
        run: ruff check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }} einrichten
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Syntax-Check (alle Quelldateien kompilieren)
        run: |
          python -m py_compile $(git ls-files '*.py' | grep -v '^workspace/' | grep -v '^test_proj/' | grep -v '^zip_proj/')

      - name: Testsuite ausführen
        # Vorher `python -m unittest discover -s tests -t . -p "test_*.py"`: sammelt nur
        # unittest.TestCase-Subklassen ein - reine Pytest-Fixture-/@pytest.mark.anyio-Tests
        # ohne TestCase (test_dashboard_sse.py, test_mcp_server_extended.py,
        # test_prompt_caching.py) wurden zwar importiert, aber NIE tatsächlich ausgeführt
        # (unittest.TestLoader kennt nur TestCase-Methoden, keine losen Testfunktionen) - ein
        # grüner CI-Lauf bedeutete für diese drei Dateien nur "importierbar", nicht "getestet".
        # `pytest` sammelt beide Testarten gleichwertig ein UND ersetzt unittest discover
        # vollständig (unittest.TestCase-Tests laufen unverändert unter pytest mit).
        #
        # `tests/` bleibt trotzdem als Argument (nicht "." fürs ganze Repo) nötig: pytest
        # erkennt tests/__init__.py und importiert jedes Modul als "tests.test_x" (Rootdir-
        # Package-Erkennung) - exakt dasselbe Verhalten wie vorher `-t .` bei unittest discover,
        # notwendig, damit tests/__init__.py (isoliert memory/run_history.py.RUN_HISTORY_FILE
        # auf ein Temp-Verzeichnis, siehe dort) für JEDEN Testlauf tatsächlich einmal ausgeführt
        # wird. --import-mode=importlib würde diese Package-Erkennung umgehen - bewusst NICHT
        # gesetzt.
        run: python -m pytest tests/ -v

  workspace-frontend-tests:
    name: Workspace-Frontend-Tests (echte npm-Testsuiten generierter Projekte)
    runs-on: ubuntu-latest
    # Realer Fund: diese CI-Datei testete bisher AUSSCHLIESSLICH den Python-Code des
    # Orchestrator-Teams selbst - ruff.toml schließt workspace/ bewusst aus (siehe dort), und
    # kein Schritt führte je `npm test` in einem generierten Node-Projekt aus. Ein grüner PR-
    # Check bedeutete deshalb nur "der Orchestrator ist ok", nicht "das generierte Frontend
    # funktioniert" - ein Node-Projekt mit kaputtem `npm test` (z.B. Jest-Konfigurationsfehler)
    # konnte so unbemerkt gemergt werden. Dieser Job findet und testet JEDES workspace/*-
    # Projekt mit einem "test"-Skript in package.json, genau wie core/verifier.py._find_node_
    # projects() das für einen echten Agentenlauf tut - kein Keyword-Matching, echtes `npm test`.
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Alle workspace/-Projekte mit npm-Test-Skript real testen
        shell: bash
        run: |
          set -e
          found_any=0
          for pkg in workspace/*/package.json workspace/*/*/package.json; do
            [ -f "$pkg" ] || continue
            dir=$(dirname "$pkg")
            has_test=$(node -e "
              const s = require('./$pkg').scripts || {};
              process.stdout.write(s.test ? '1' : '0');
            ")
            if [ "$has_test" = "1" ]; then
              found_any=1
              echo "::group::npm test ($dir)"
              (cd "$dir" && npm ci && npm test)
              echo "::endgroup::"
            fi
          done
          if [ "$found_any" -eq 0 ]; then
            echo "Keine workspace/-Projekte mit npm-Test-Skript gefunden - nichts zu tun."
          fi

  workspace-typescript-check:
    name: Workspace-TypeScript-Check (Syntaxfehler generierter .ts/.tsx-Dateien)
    runs-on: ubuntu-latest
    # Pendant zu workspace-python-check unten, für TypeScript/TSX: workspace-frontend-tests
    # oben läuft NUR, wenn ein Projekt bereits ein "test"-Skript in package.json hat - ein
    # generiertes .tsx/.ts-Fragment ganz ohne package.json/Testsuite (real beobachtet:
    # workspace/fastapi-task-mgmt/frontend/src/components/TaskList.tsx und
    # .../hooks/useTaskWebSocket.ts, beide ohne eigenes package.json) durchlief bisher KEINEN
    # einzigen CI-Check. `tsc --noEmit` ohne installierte node_modules/@types schlägt für so gut
    # wie jeden Import mit TS2307 ("Cannot find module") fehl - das ist reines Umgebungsrauschen
    # (workspace/-Projekte werden bewusst ohne node_modules committet), keine echte
    # Code-Aussage. TS2307 wird deshalb gezielt ausgefiltert, jeder ANDERE Diagnose-Code
    # (Syntaxfehler, falsch referenzierte lokale Namen, kaputtes JSX, …) lässt den Job
    # fehlschlagen - dieselbe Güteklasse wie `ruff --select F,E9` beim Python-Pendant.
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: tsc --noEmit über alle workspace/-.ts(x)-Dateien (Typ-Umgebungsrauschen bewusst ignoriert)
        shell: bash
        run: |
          set -e
          # 1. Projekte mit eigenem tsconfig.json prüfen (z.B. ecochef)
          for cfg in workspace/*/tsconfig.json workspace/*/*/tsconfig.json; do
            [ -f "$cfg" ] || continue
            dir=$(dirname "$cfg")
            echo "::group::tsc ($cfg)"
            if [ -f "$dir/package.json" ]; then
              (cd "$dir" && npm ci)
            fi
            set +e
            output=$(npx --yes -p typescript@5.6.3 tsc -p "$cfg" --noEmit --pretty false --skipLibCheck 2>&1)
            set -e
            echo "$output"
            real_errors=$(echo "$output" | grep -E "error TS" \
              | grep -v "error TS2307:" \
              | grep -vE "error TS(2503|2582|2304|2708|2694):" || true)
            if [ -n "$real_errors" ]; then
              echo "::error::Echte TypeScript-Fehler in $cfg gefunden:"
              echo "$real_errors"
              exit 1
            fi
            echo "::endgroup::"
          done

          # 2. Standalone-Fragmente ohne eigenes tsconfig.json prüfen
          standalone_files=""
          for f in $(git ls-files 'workspace/*.ts' 'workspace/*.tsx'); do
            dir=$(dirname "$f")
            if [ ! -f "$dir/tsconfig.json" ] && [ ! -f "$dir/../tsconfig.json" ] && [ ! -f "$dir/../../tsconfig.json" ]; then
              standalone_files="$standalone_files $f"
            fi
          done

          if [ -n "$standalone_files" ]; then
            echo "::group::tsc standalone files ($standalone_files)"
            set +e
            output=$(npx --yes -p typescript@5.6.3 tsc --noEmit --pretty false \
              --jsx react-jsx --esModuleInterop --skipLibCheck \
              --moduleResolution node --target es2020 --module esnext $standalone_files 2>&1)
            set -e
            echo "$output"
            real_errors=$(echo "$output" | grep -E "error TS" \
              | grep -v "error TS2307:" \
              | grep -vE "error TS(2503|2582|2304|2708|2694):" || true)
            if [ -n "$real_errors" ]; then
              echo "::error::Echte TypeScript-Fehler in Standalone-Dateien gefunden:"
              echo "$real_errors"
              exit 1
            fi
            echo "::endgroup::"
          fi

  workspace-python-check:
    name: Workspace-Python-Check (Syntax + undefinierte Namen generierter Projekte)
    runs-on: ubuntu-latest
    # Realer Fund (Retrospektive zu vier parallelen Kanban/Task-Management-Läufen): ruff.toml
    # schließt workspace/ bewusst aus (siehe dort - vom KI-Team generierter Code, eigener Stil
    # je Aufgabe), und der Syntax-Check im "test"-Job oben filtert workspace/ ebenfalls komplett
    # heraus. Der interne Verifier (core/verifier.py._lint_python, läuft WÄHREND eines echten
    # Agentenlaufs) hatte einen Bug korrekt erkannt und den Lauf zu Recht als
    # verification_ok=false markiert (workspace/kanban_task_manager/app/main.py rief
    # `json.loads()` auf, ohne `json` zu importieren) - dieses Ergebnis wurde aber NIRGENDS
    # durch eine zweite, unabhängige Prüfung nach dem Lauf abgesichert. Ein grüner PR-Check
    # bedeutete deshalb bisher nur "Orchestrator-Framework und ggf. Node-Frontends sind ok",
    # nicht "der von diesem PR mitgebrachte generierte Python-Code kompiliert und referenziert
    # keine undefinierten Namen". Dieser Job schließt genau diese Lücke, unabhängig vom
    # internen Verifier-Ergebnis einer vorherigen Sitzung.
    #
    # `ruff check --isolated`: ignoriert ruff.toml bewusst (u.a. dessen extend-exclude =
    # ["workspace", ...]) - sonst würde genau die Konfiguration greifen, die diese Dateien
    # eigentlich schützen soll. `--select F,E9`: nur pyflakes (unused/undefined names, u.a.
    # das reale F821 oben) und echte Syntaxfehler - bewusst KEIN Stil-/Format-Linting (E/I/UP/
    # B/C4), da generierter Code laut ruff.toml einen eigenen, nicht von uns gepflegten Stil
    # haben darf. Läuft nur über tatsächlich vorhandene .py-Dateien unter workspace/, damit ein
    # Lauf ganz ohne Python-Projekte nicht fehlschlägt.
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: ruff installieren
        run: pip install -r requirements-dev.txt

      - name: Syntax-Check (workspace/-Python-Dateien kompilieren)
        shell: bash
        run: |
          files=$(git ls-files 'workspace/*.py')
          if [ -z "$files" ]; then
            echo "Keine workspace/-Python-Dateien gefunden - nichts zu tun."
          else
            python -m py_compile $files
          fi

      - name: ruff check (nur F821/E9, ruff.toml-Exclude bewusst umgangen - siehe Kommentar oben)
        shell: bash
        run: |
          files=$(git ls-files 'workspace/*.py')
          if [ -z "$files" ]; then
            echo "Keine workspace/-Python-Dateien gefunden - nichts zu tun."
          else
            ruff check --isolated --select F821,E9 $files
          fi
