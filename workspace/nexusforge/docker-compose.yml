version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: nexusforge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - nexusforge-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexusforge-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./nexusforge.db
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=False
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - nexusforge-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexusforge-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - nexusforge-net

volumes:
  redis-data:
    driver: local
  backend-data:
    driver: local

networks:
  nexusforge-net:
    driver: bridge
