<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <defs>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sentinel Shield Grid Emblem -->
  <g transform="translate(10, 10)">
    <polygon points="30,4 56,16 56,44 30,56 4,44 4,16" stroke="url(#gridGrad)" stroke-width="2.5" fill="#1E293B" />
    <path d="M12 30h36 M30 12v36" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6" />
    <circle cx="30" cy="30" r="4" fill="#10B981" filter="url(#glow)" />
  </g>

  <!-- Wordmark -->
  <text x="80" y="38" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" letter-spacing="0.5">
    SENTINEL<tspan fill="#3B82F6">GRID</tspan>
  </text>
  <text x="80" y="54" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" letter-spacing="1.5">
    OBSERVABILITY &amp; SYNTHETICS
  </text>
</svg>
