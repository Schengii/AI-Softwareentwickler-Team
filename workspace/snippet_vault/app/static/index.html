<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snippet Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">
    <header class="p-4 border-b border-slate-700 flex justify-between items-center">
        <h1 class="text-xl font-bold">Snippet Vault</h1>
        <div id="tag-filter" class="flex gap-2">
            <!-- Tags werden hier dynamisch geladen -->
        </div>
    </header>

    <main class="flex-grow flex p-4 gap-4">
        <section class="w-1/2 flex flex-col">
            <textarea id="markdown-input" class="flex-grow bg-slate-800 p-4 rounded border border-slate-700 focus:outline-none focus:border-blue-500" placeholder="Markdown hier eingeben..."></textarea>
        </section>
        <section class="w-1/2 bg-slate-800 p-4 rounded border border-slate-700 overflow-y-auto">
            <div id="preview" class="prose prose-invert max-w-none"></div>
        </section>
    </main>

    <script>
        const input = document.getElementById('markdown-input');
        const preview = document.getElementById('preview');

        input.addEventListener('input', (e) => {
            const html = marked.parse(e.target.value);
            preview.innerHTML = html;
            Prism.highlightAllUnder(preview);
        });

        async function loadTags() {
            const container = document.getElementById('tag-filter');
            try {
                const response = await fetch('/tags');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const tags = await response.json();
                container.innerHTML = tags.map(tag =>
                    `<span class="bg-blue-900 text-blue-200 px-2 py-1 rounded text-sm cursor-pointer">${tag}</span>`
                ).join('');
            } catch (err) {
                console.warn('Tags nicht verfügbar (evtl. kein Backend aktiv):', err);
                container.innerHTML = '';
            }
        }

        loadTags();
    </script>
</body>
</html>
