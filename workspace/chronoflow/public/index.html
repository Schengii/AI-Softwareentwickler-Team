<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChronoFlow Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Sichtbarer Fokus-Indikator für Tastaturnutzer */
        button:focus-visible, a:focus-visible {
            outline: 3px solid #2563eb;
            outline-offset: 2px;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-8">
    <main class="max-w-6xl mx-auto">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800">ChronoFlow Dashboard</h1>
            <p class="text-gray-600">Echtzeit-Überwachung der Saga-Workflows</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Workflow Start -->
            <section class="bg-white p-6 rounded-lg shadow" aria-labelledby="start-heading">
                <h2 id="start-heading" class="text-xl font-semibold mb-4">Workflow starten</h2>
                <button id="startWorkflow" class="w-full bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700 transition focus:outline-none">
                    Neuen Workflow triggern
                </button>
            </section>

            <!-- Status Liste -->
            <section class="md:col-span-2 bg-white p-6 rounded-lg shadow" aria-labelledby="status-heading">
                <h2 id="status-heading" class="text-xl font-semibold mb-4">Aktive Workflows</h2>
                <!-- aria-live="polite" kündigt Änderungen an, ohne den Nutzer zu unterbrechen -->
                <div id="workflowList" class="space-y-2" aria-live="polite">
                    <p class="text-gray-500 italic">Keine aktiven Workflows.</p>
                </div>
            </section>
        </div>
    </main>

    <script>
        const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
        const ws = new WebSocket(`${protocol}://${window.location.host}/ws/sagas`);

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            updateUI(data);
        };

        document.getElementById('startWorkflow').addEventListener('click', async () => {
            try {
                const response = await fetch('/api/v1/sagas', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Idempotency-Key': crypto.randomUUID()
                    },
                    body: JSON.stringify({ workflow_type: 'order_fulfillment', payload: {} })
                });
                if (!response.ok) alert('Fehler beim Starten des Workflows');
            } catch (e) {
                console.error('Netzwerkfehler:', e);
            }
        });

        function updateUI(data) {
            const list = document.getElementById('workflowList');
            if (list.querySelector('p')) list.innerHTML = '';
            const item = document.createElement('div');
            item.className = 'p-3 border-b border-gray-200 flex justify-between';
            item.innerHTML = `<span class="sr-only">Saga ID:</span><span>${data.id}</span><span class="font-bold" aria-label="Status: ${data.status}">${data.status}</span>`;
            list.prepend(item);
        }
    </script>
</body>
</html>
