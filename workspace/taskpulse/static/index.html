<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskPulse Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-blue-600 p-4 text-white shadow-lg">
        <h1 class="text-xl font-bold">TaskPulse Dashboard</h1>
    </nav>
    <main class="container mx-auto p-6">
        <section class="mb-8">
            <h2 class="text-2xl font-semibold mb-4">Aufgaben</h2>
            <div id="tasks-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Tasks werden hier via JS geladen -->
            </div>
        </section>
        <section>
            <h2 class="text-2xl font-semibold mb-4">API Status</h2>
            <div id="status-container" class="bg-white p-4 rounded shadow">
                <!-- Status wird hier via JS geladen -->
            </div>
        </section>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
