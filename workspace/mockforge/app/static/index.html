<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MockForge Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>MockForge</h1>
    </header>
    <main>
        <section id="mock-management">
            <h2>Mocks verwalten</h2>
            <form id="mock-form">
                <input type="text" id="method" placeholder="Method (GET/POST)" required>
                <input type="text" id="path" placeholder="Path Pattern" required>
                <input type="number" id="status" placeholder="Status Code" required>
                <textarea id="body" placeholder="Response Body"></textarea>
                <button type="submit">Mock erstellen</button>
            </form>
            <table id="mock-table">
                <thead><tr><th>Method</th><th>Path</th><th>Status</th><th>Action</th></tr></thead>
                <tbody></tbody>
            </table>
        </section>
        <section id="traffic-log">
            <h2>Live Traffic</h2>
            <table id="traffic-table">
                <thead><tr><th>Time</th><th>Method</th><th>URL</th><th>Status</th></tr></thead>
                <tbody></tbody>
            </table>
        </section>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
