<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebhookShield Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { dark: '#121212', surface: '#1e1e1e' } } }
        }
    </script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark text-gray-200 min-h-screen">
    <nav class="border-b border-gray-800 p-4">
        <h1 class="text-xl font-bold text-blue-500">WebhookShield</h1>
    </nav>
    <main class="container mx-auto p-6">
        <section id="webhook-list" class="space-y-4">
            <h2 class="text-lg font-semibold">Aktuelle Webhooks</h2>
            <div id="logs-container" class="grid gap-4">
                <!-- Webhook-Einträge werden hier via JS eingefügt -->
            </div>
        </section>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
