services:
  chronos-ledger:
    build:
      context: .
      dockerfile: Dockerfile
    image: chronos-ledger:latest
    container_name: chronos_ledger_gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=ChronosLedger
      - VERSION=1.0.0
      - DATABASE_URL=sqlite+aiosqlite:////app/data/chronos_ledger.db
      - LOG_LEVEL=INFO
      - BATCH_FLUSH_INTERVAL=2.0
      - RING_BUFFER_CAPACITY=10000
    volumes:
      - chronos_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  chronos_data:
    driver: local
