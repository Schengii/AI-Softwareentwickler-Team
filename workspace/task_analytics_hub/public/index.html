<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard | Task & Performance Hub</title>
    <style>
        :focus { outline: 3px solid #ffbf47; outline-offset: 2px; }
        .skip-link { position: absolute; top: -40px; left: 0; background: #000; color: #fff; padding: 8px; z-index: 100; }
        .skip-link:focus { top: 0; }
        body { font-family: sans-serif; background: #121212; color: #e0e0e0; margin: 0; }
        header { padding: 1rem; border-bottom: 1px solid #333; }
        main { padding: 1rem; }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">Zum Hauptinhalt springen</a>
    
    <header>
        <nav aria-label="Hauptnavigation">
            <h1>Analytics Dashboard</h1>
        </nav>
    </header>

    <main id="main-content">
        <section aria-labelledby="metrics-heading">
            <h2 id="metrics-heading">Team-Metriken</h2>
            <div role="region" aria-live="polite" aria-atomic="true">
                <p>Backend-Status: <span id="status-indicator">Verbunden</span></p>
            </div>
        </section>
    </main>
</body>
</html>
