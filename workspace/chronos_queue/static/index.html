<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronos Queue Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Chronos Queue Dashboard</h1>
    </header>
    <main>
        <section aria-labelledby="jobs-heading">
            <h2 id="jobs-heading">Aktive Jobs</h2>
            <table id="jobs-table">
                <thead>
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Name</th>
                        <th scope="col">Status</th>
                        <th scope="col">Aktionen</th>
                    </tr>
                </thead>
                <tbody id="jobs-body" aria-live="polite">
                    <!-- Jobs werden hier dynamisch eingefügt -->
                </tbody>
            </table>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
