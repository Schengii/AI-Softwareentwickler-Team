version: '3.8'
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./logipulse.db
    volumes:
      - .:/app
    restart: unless-stopped

  # Frontend placeholder (Vite)
  frontend:
    image: node:18-alpine
    working_dir: /app
    command: npm run dev -- --host
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    restart: unless-stopped
