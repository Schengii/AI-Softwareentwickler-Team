name: AI Team Autonomous Scheduler

# Team-Optimierung (2026-09-05): der neue "Run Backlog Worker Cycle"-Schritt kann jetzt deutlich
# länger laufen als die ursprünglichen reinen Poll-Schritte (siehe timeout-minutes unten) - ohne
# concurrency-Guard könnte der nächste Cron-Trigger (alle 30 Minuten) starten, WÄHREND ein
# vorheriger Lauf noch an einem Backlog-Ticket arbeitet, und dasselbe Ticket doppelt aufgreifen
# (doppelter Tokenverbrauch, ggf. widersprüchliche PRs). cancel-in-progress bewusst NICHT
# gesetzt: ein bereits laufender Fix-Versuch soll zu Ende laufen statt mitten drin abgebrochen
# zu werden - der neue Lauf wartet stattdessen, bis der alte fertig ist.
concurrency:
  group: ai-team-scheduler
  cancel-in-progress: false

on:
  schedule:
    # Alle 30 Minuten: die vier günstigen, rein GitHub-/Backlog-basierten Schritte unten.
    - cron: '*/30 * * * *'
    # Team-Optimierung (2026-09-05, KI-Team-Optimierungs-Session): Workspace-Audit und
    # Deployment-Health-Check installieren für JEDES workspace/-Projekt (aktuell 21) eine
    # frische Umgebung UND führen dessen echte Testsuite aus (.ai_team_venv ist gitignored,
    # jeder Runner startet bei null) - alle 30 Minuten wäre das sowohl ein reales Timeout-
    # Risiko (der Job hat 90 Min. insgesamt, siehe timeout-minutes) als auch unnötig teuer an
    # CI-Minuten für eine Prüfung, die sich innerhalb von Stunden kaum ändert. Eigener, selten
    # feuernder Cron-Eintrag statt am 30-Minuten-Takt der günstigen Schritte mitzulaufen.
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Auszuführende Aktion'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - check-issues
          - check-pr-reviews
          - check-dependencies
          - work-backlog
          - audit-workspace
          - check-deployments

jobs:
  scheduled-cycle:
    runs-on: ubuntu-latest
    # Team-Optimierung (2026-09-05): 30 Minuten reichten für die ursprünglichen drei reinen
    # GitHub-Poll-Schritte (Sekunden bis wenige Minuten). Der "Run Backlog Worker Cycle"-Schritt
    # kann einen VOLLEN Orchestrator-Lauf auslösen (real beobachtet: bis zu ~20+ Minuten für ein
    # einzelnes Ticket, siehe taskpulse-Retrospektive) - ohne Erhöhung würde der Job mitten in
    # einem laufenden Fix-Versuch hart abgebrochen statt sauber zu beenden. Weiter erhöht
    # (KI-Team-Optimierungs-Session): der 6-stündige Workspace-Audit-Zyklus installiert UND
    # testet potenziell alle 21 workspace/-Projekte nacheinander in derselben Job-Ausführung.
    timeout-minutes: 90
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Team-Optimierung (2026-09-05, KI-Team-Optimierungs-Session, kritischer Fund): core/
      # backlog_store.py/memory/run_history.py/core/deployment_status.py schreiben bewusst
      # .gitignore'te Laufzeitdateien (memory/*.json, workspace/*/.ai_team_deployment.json -
      # Laufzeitdaten, kein Code). Ein frischer `actions/checkout` hat diese Dateien NIE - der
      # "Run Backlog Worker Cycle"-Schritt unten sah dadurch bei JEDEM bisherigen Cloud-Lauf ein
      # LEERES Backlog (lief "erfolgreich" durch, aber komplett wirkungslos - genau die Falle,
      # vor der der README-Abschnitt zu `--work-backlog`/`--check-deployments` ausdrücklich
      # warnt), und die neue teamweite Verifikations-Trend-Prüfung (core/optimization_advisor.py,
      # Teil von "Run Workspace Audit Cycle" unten) hätte in der Cloud NIE genug akkumulierte
      # Lauf-Historie gesehen, um je auszulösen. Standard-Kniff für kontinuierlich veränderten
      # State über Cron-Läufe hinweg: ein lauf-EINDEUTIGER Schlüssel (immer ein "Cache Miss",
      # speichert also am Ende IMMER den aktuellen Stand) + `restore-keys`-Präfix (findet den
      # Eintrag der VORHERIGEN Ausführung per Präfixsuche).
      - name: Restore persistent AI-Team state (backlog, run history, deployment status)
        uses: actions/cache@v4
        with:
          path: |
            memory/*.json
            workspace/*/.ai_team_deployment.json
          key: ai-team-state-${{ github.run_id }}
          restore-keys: |
            ai-team-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run GitHub Issue Watcher Cycle
        if: github.event.inputs.action == 'all' || github.event.inputs.action == 'check-issues' || github.event_name == 'schedule'
        run: |
          python main.py --check-issues

      - name: Run PR Review Feedback Cycle
        if: github.event.inputs.action == 'all' || github.event.inputs.action == 'check-pr-reviews' || github.event_name == 'schedule'
        run: |
          python main.py --check-pr-reviews

      - name: Run Dependency Vulnerability Watch
        if: github.event.inputs.action == 'all' || github.event.inputs.action == 'check-dependencies' || github.event_name == 'schedule'
        run: |
          python main.py --check-dependencies

      # Team-Optimierung (Retrospektive 2026-09-05): core/backlog_worker.py wurde genau für
      # diesen Scheduler gebaut (siehe dessen Docstring, "aufgerufen ... z.B. per Cron/
      # Taskplaner/GitHub-Actions-Schedule"), aber bis hierher NIE tatsächlich hier eingebunden
      # - liegen gebliebene Tickets (recurring-failure-*, unresolved-governance-critical-*,
      # recurring-lint-*, ...) blieben ohne manuellen `--work-backlog`-Aufruf für immer
      # "blocked", die eingebaute Modell-Eskalation ab dem zweiten Retry (Orchestrator
      # (escalate_models=True)) griff dadurch nie automatisch. BACKLOG_WORKER_MAX_PER_CYCLE=1
      # (Standard, config.py) begrenzt bereits konservativ auf ein Ticket pro Zyklus - dieselbe
      # Vorsicht wie bei den anderen drei Checks oben.
      - name: Run Backlog Worker Cycle
        if: github.event.inputs.action == 'all' || github.event.inputs.action == 'work-backlog' || github.event_name == 'schedule'
        run: |
          python main.py --work-backlog

      # Team-Optimierung (Retrospektive 2026-09-05, KI-Team-Optimierungs-Session): core/
      # workspace_audit.py und core/production_monitor.py waren bereits vollstaendig gebaut und
      # getestet, liefen aber bisher NIRGENDS periodisch - weder hier noch als lokaler
      # Taskplaner-Eintrag. core/workspace_audit.py deckt zusaetzlich seit dieser Aenderung die
      # teamweite Verifikations-Trend-Pruefung ab (core/optimization_advisor.py) - genau das
      # Werkzeug, das die "0 von 10 Laeufen gruen"-Regression sichtbar gemacht haette, waere es
      # schon vorher scharf geschaltet gewesen. Bewusst NUR am 6-Stunden-Cron (nicht am
      # 30-Minuten-Takt der guenstigen Schritte oben) - siehe Docstring am `on.schedule` oben.
      - name: Run Workspace Audit Cycle
        if: github.event.inputs.action == 'all' || github.event.inputs.action == 'audit-workspace' || github.event.schedule == '0 */6 * * *'
        run: |
          python main.py --audit-workspace

      - name: Run Deployment Health Check Cycle
        if: github.event.inputs.action == 'all' || github.event.inputs.action == 'check-deployments' || github.event.schedule == '0 */6 * * *'
        run: |
          python main.py --check-deployments

      # "Watchdog fuer den Watchdog" (Team-Optimierung, KI-Team-Optimierungs-Session): ein
      # lokaler Windows-Taskplaner-Eintrag fuer denselben Zweck (AI-Team-IssueWatcher) lief real
      # ueber 10 Tage unbemerkt NICHT (deaktiviert, 1058 verpasste Ausfuehrungen), bevor es
      # jemandem auffiel - niemand ueberwacht die eigene Ueberwachung. Schlaegt IRGENDEIN Schritt
      # oben fehl (z.B. ein abgelaufener API-Key), postet dieser Schritt ueber denselben, bereits
      # vorhandenen Webhook-Mechanismus (core/notifier.py) eine Benachrichtigung, statt dass der
      # Ausfall nur in den GitHub-Actions-Logs verschwindet, die niemand aktiv nachschaut.
      - name: Notify on scheduler failure
        if: failure()
        run: |
          if [ -n "$NOTIFY_WEBHOOK_URL" ]; then
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            curl -s -X POST -H 'Content-Type: application/json' \
              -d "{\"text\": \"🔴 AI Team Scheduler fehlgeschlagen (${{ github.repository }}, Lauf ${{ github.run_id }}): $RUN_URL\"}" \
              "$NOTIFY_WEBHOOK_URL" || true
          fi
